[package]
name = "tinyskills"
description = "Portable parsing, discovery, and filesystem primitives for agent skill bundles"
keywords = ["agents", "skills", "markdown", "ai"]
categories = ["filesystem", "parsing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
rustix.workspace = true
zip = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
cap-std.workspace = true
cap-fs-ext.workspace = true

[features]
# `read_skill_archive`: read an uploaded `.zip`/`.skill`, `.tar` or `.tar.gz`
# skill archive, refusing traversal, links, nested archives and bombs. Off by
# default so a host that never accepts uploads links no archive code.
archive = ["dep:zip", "dep:tar", "dep:flate2"]
# `SkillRegistry`: cached, searchable skill catalogs fetched through a
# host-supplied `RegistryTransport`. The crate links no HTTP client.
registry = ["tokio/sync", "tokio/time"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "test-util", "time"] }

[lints]
workspace = true
